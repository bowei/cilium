apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: network-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: pod2
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
      - ipBlock:
          cidr: 1.1.0.0/16
          except:
          - 1.1.1.10/32
          - 1.1.1.11/32
      - podSelector:
          matchLabels:
            app: pod1
  egress:
    - to:
      - ipBlock:
          cidr: 1.1.1.2/32
      - podSelector:
          matchLabels:
            app: pod1
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: network-policy2
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: pod2
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
      - ipBlock:
          cidr: 2.0.0.0/16
